services:
  mysql:
    image: mysql:8.4
    container_name: distribusi_mbg_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: distribusi_mbg
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: distribusi_mbg
      MYSQL_PASSWORD: distribusi_mbg
    ports:
      - "3307:3306"
    volumes:
      - distribusi_mbg_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: distribusi_mbg_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"

volumes:
  distribusi_mbg_mysql_data:
